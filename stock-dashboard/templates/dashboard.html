<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Stocks">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <title>Stock Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app">
        <header>
            <h1>Stock Dashboard</h1>
            <div class="header-controls">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="종목명 또는 코드 검색..." />
                    <div id="searchResults" class="search-results"></div>
                </div>
                <div class="market-filter">
                    <button class="filter-btn active" data-market="all">전체</button>
                    <button class="filter-btn" data-market="kr">한국</button>
                    <button class="filter-btn" data-market="us">미국</button>
                </div>
                <button id="refreshBtn" class="refresh-btn">새로고침</button>
            </div>
            <div class="update-info">
                <span id="updateTime">-</span>
                <span id="autoRefreshStatus" class="auto-refresh">자동 갱신 30초</span>
            </div>
        </header>

        <main>
            <div class="stock-grid" id="stockGrid">
                <div class="loading">데이터를 불러오는 중...</div>
            </div>

            <div id="chartModal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="chartTitle">-</h2>
                        <div class="chart-period">
                            <button class="period-btn active" data-days="7">1주</button>
                            <button class="period-btn" data-days="30">1개월</button>
                            <button class="period-btn" data-days="90">3개월</button>
                            <button class="period-btn" data-days="365">1년</button>
                        </div>
                        <button class="close-btn" id="closeChart">&times;</button>
                    </div>
                    <div class="chart-container">
                        <canvas id="priceChart"></canvas>
                    </div>
                    <div class="chart-container volume-chart">
                        <canvas id="volumeChart"></canvas>
                    </div>
                    <div class="stock-detail" id="stockDetail"></div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-view="all" onclick="switchView('all')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                <span>전체</span>
            </button>
            <button class="nav-item" data-view="kr" onclick="switchView('kr')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                <span>한국</span>
            </button>
            <button class="nav-item" data-view="us" onclick="switchView('us')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                <span>미국</span>
            </button>
            <button class="nav-item" onclick="document.getElementById('searchInput').focus()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>검색</span>
            </button>
        </nav>
    </div>

    <script src="/static/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').then(reg => {
                console.log('SW registered:', reg.scope);
            });
        }
    </script>
</body>
</html>
